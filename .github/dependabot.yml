version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    # Espera a versão nova ter alguns dias de uso antes de sugerir (proteção contra pacote adulterado).
    cooldown:
      default-days: 7
    groups:
      ferramentas-de-desenvolvimento:
        dependency-type: development
        update-types: [minor, patch]
    commit-message:
      prefix: 'chore(deps)'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: America/Sao_Paulo
    commit-message:
      prefix: 'ci(deps)'
