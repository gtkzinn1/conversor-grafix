name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Permissão mínima: o CI só lê o código.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, tipos, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Actions fixadas por commit (SHA), não por tag, contra adulteração.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Instalar dependências (versões exatas do package-lock)
        run: npm ci

      - name: Conferir o qpdf WebAssembly versionado (SHA-256 do BUILD-INFO)
        working-directory: vendor/qpdf
        run: grep -E '^[0-9a-f]{64}  qpdf\.(js|wasm)$' BUILD-INFO | sha256sum -c -

      - name: Auditoria de dependências
        run: npm audit --audit-level=high

      - name: Formatação
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Testes unitários
        run: npm test

      - name: Build de produção (inclui checagem de tipos)
        run: npm run build

      - name: Testes ponta a ponta (Google Chrome)
        run: npm run test:e2e

      - name: Relatório do Playwright em caso de falha
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
